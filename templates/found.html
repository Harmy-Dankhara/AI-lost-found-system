{% extends "base.html" %}

{% block content %}
<div class="lost-found-container compact-form">
    <h2 class="page-title">Report Found Item</h2>
    <form action="{{ url_for('report_found') }}" method="POST" enctype="multipart/form-data"
          class="lost-found-form" id="reportForm" onsubmit="return validateLocation()">

        <div class="form-group">
            <label for="name">Item Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Blue Backpack" required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Accessories">Accessories</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- ── Location Field ─────────────────────────────────── -->
        <div class="form-group">
            <label for="location">Found Location</label>

            <!-- Location method badges -->
            <div class="loc-method-row" id="locMethodRow" style="display:none;">
                <span id="locMethodBadge" class="loc-method-badge"></span>
                <button type="button" class="loc-clear-btn" onclick="clearLocation()" title="Clear location">✕</button>
            </div>

            <!-- Input row: text + auto-detect + map picker -->
            <div class="location-row">
                <input type="text" id="location" name="location"
                       placeholder="e.g. Cafeteria, 2nd Floor"
                       required
                       oninput="onLocationInput()"
                       onblur="geocodeLocation()">
                <button type="button" class="geo-btn" id="geoBtn"
                        onclick="detectLocation()" title="Auto-detect my location">📍</button>
                <button type="button" class="geo-btn map-pick-btn" id="mapPickBtn"
                        onclick="openMapPicker()" title="Pick on map">🗺️</button>
            </div>

            <!-- Hidden coordinate fields -->
            <input type="hidden" id="lat"            name="lat">
            <input type="hidden" id="lng"            name="lng">
            <input type="hidden" id="location_source" name="location_source" value="manual">

            <!-- Status message -->
            <span class="geo-status" id="geoStatus"></span>
        </div>
        <!-- ───────────────────────────────────────────────────── -->

        <div class="form-group">
            <label for="contact">Your Contact</label>
            <input type="text" id="contact" name="contact" placeholder="Email or phone number" required>
        </div>

        <div class="form-group">
            <label for="image">Upload Image</label>
            <input type="file" id="image" name="image" class="file-input">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"
                      placeholder="Briefly describe what you found — color, condition, any markings..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Report Found Item</button>
    </form>
</div>

<!-- ══════════════════════════════════════════════════════════
     MAP PICKER MODAL
════════════════════════════════════════════════════════════ -->
<div id="mapPickerOverlay" class="map-picker-overlay" onclick="closeMapPicker(event)">
    <div class="map-picker-modal">
        <div class="map-picker-header">
            <h3>📍 Pick Location on Map</h3>
            <p class="map-picker-sub">Click anywhere on the map to set the location</p>
        </div>
        <div id="mapPickerCanvas"></div>
        <div class="map-picker-footer">
            <span id="mapPickerCoords" class="map-picker-coords">No location selected</span>
            <div class="map-picker-actions">
                <button type="button" class="map-picker-cancel" onclick="closeMapPickerBtn()">Cancel</button>
                <button type="button" class="map-picker-confirm" id="mapPickerConfirm"
                        onclick="confirmMapLocation()" disabled>Confirm Location</button>
            </div>
        </div>
    </div>
</div>

<!-- ── Leaflet (for map picker modal only) ───────────────── -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.querySelector('.container').classList.add('form-page');

/* ══════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════════ */
let pickerMap   = null;
let pickerMarker = null;
let pickedLat   = null;
let pickedLng   = null;
let geocoding   = false;

/* ══════════════════════════════════════════════════════════
   HELPERS – status & method badge
════════════════════════════════════════════════════════════ */
function setStatus(msg, type='info') {
    const el = document.getElementById('geoStatus');
    el.textContent = msg;
    el.className = 'geo-status' + (type === 'error' ? ' geo-status-error' : type === 'success' ? ' geo-status-success' : '');
}

function setMethodBadge(method) {
    const row   = document.getElementById('locMethodRow');
    const badge = document.getElementById('locMethodBadge');
    const src   = document.getElementById('location_source');
    const icons = { auto: '📍 Auto detected', map: '🗺️ Selected on map', manual: '✏️ Typed manually' };
    const cls   = { auto: 'loc-badge-auto', map: 'loc-badge-map', manual: 'loc-badge-manual' };
    badge.textContent  = icons[method] || method;
    badge.className    = 'loc-method-badge ' + (cls[method] || '');
    src.value          = method;
    row.style.display  = 'flex';
}

function setCoords(lat, lng) {
    document.getElementById('lat').value = lat;
    document.getElementById('lng').value = lng;
}

function clearLocation() {
    setCoords('', '');
    document.getElementById('location_source').value = 'manual';
    document.getElementById('locMethodRow').style.display = 'none';
    document.getElementById('location').value = '';
    setStatus('');
}

function onLocationInput() {
    // User is typing manually – wipe persisted coords so geocoding re-runs on blur
    setCoords('', '');
    document.getElementById('locMethodRow').style.display = 'none';
}

/* ══════════════════════════════════════════════════════════
   METHOD 1 – AUTO GEOLOCATION
════════════════════════════════════════════════════════════ */
function detectLocation() {
    const btn = document.getElementById('geoBtn');
    if (!navigator.geolocation) {
        setStatus('Geolocation not supported by your browser.', 'error');
        return;
    }
    btn.textContent  = '⏳';
    btn.disabled     = true;
    setStatus('Detecting your location…');

    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude.toFixed(6);
            const lng = pos.coords.longitude.toFixed(6);
            setCoords(lat, lng);
            // Reverse-geocode with Nominatim
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
                .then(r => r.json())
                .then(d => {
                    const addr  = d.address || {};
                    const label = addr.suburb || addr.city_district ||
                                  addr.city   || addr.town || addr.village || d.display_name || 'Your Location';
                    document.getElementById('location').value = label;
                    setStatus(`✅ Detected: ${label}`, 'success');
                    setMethodBadge('auto');
                })
                .catch(() => {
                    document.getElementById('location').value = `${lat}, ${lng}`;
                    setStatus(`✅ Coordinates captured (${lat}, ${lng})`, 'success');
                    setMethodBadge('auto');
                })
                .finally(() => { btn.textContent = '📍'; btn.disabled = false; });
        },
        err => {
            setStatus('❌ Location access denied. Enter address or pick on map.', 'error');
            btn.textContent = '📍';
            btn.disabled    = false;
        },
        { timeout: 10000 }
    );
}

/* ══════════════════════════════════════════════════════════
   METHOD 2 – GEOCODING (text → coordinates)
════════════════════════════════════════════════════════════ */
async function geocodeLocation() {
    const locText = document.getElementById('location').value.trim();
    if (!locText || geocoding) return;
    // If coordinates already set (e.g. from auto-detect), skip
    if (document.getElementById('lat').value) return;

    geocoding = true;
    setStatus('🔍 Looking up location…');

    try {
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(locText)}&format=json&limit=1`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        const data = await res.json();

        if (data && data.length > 0) {
            const { lat, lon, display_name } = data[0];
            setCoords(parseFloat(lat).toFixed(6), parseFloat(lon).toFixed(6));
            setStatus(`✅ Found: ${display_name.split(',').slice(0,3).join(',')}`, 'success');
            setMethodBadge('manual');
        } else {
            setStatus('⚠️ Location not found. Try picking on map.', 'error');
        }
    } catch(e) {
        setStatus('⚠️ Geocoding failed. Check your connection.', 'error');
    } finally {
        geocoding = false;
    }
}

/* ══════════════════════════════════════════════════════════
   METHOD 3 – MAP PICKER MODAL
════════════════════════════════════════════════════════════ */
function openMapPicker() {
    const overlay = document.getElementById('mapPickerOverlay');
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    // Initialise map only once
    if (!pickerMap) {
        pickerMap = L.map('mapPickerCanvas', { zoomControl: true })
                     .setView([20, 78], 4);   // Default: India

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            subdomains: 'abcd', maxZoom: 19
        }).addTo(pickerMap);

        pickerMap.on('click', onMapClick);

        // Try to center on existing coords
        const existLat = parseFloat(document.getElementById('lat').value);
        const existLng = parseFloat(document.getElementById('lng').value);
        if (!isNaN(existLat) && !isNaN(existLng)) {
            pickerMap.setView([existLat, existLng], 14);
            placePickerMarker(existLat, existLng);
        }
    }

    setTimeout(() => pickerMap.invalidateSize(), 200);
}

function onMapClick(e) {
    placePickerMarker(e.latlng.lat, e.latlng.lng);
}

function placePickerMarker(lat, lng) {
    pickedLat = lat;
    pickedLng = lng;
    if (pickerMarker) pickerMap.removeLayer(pickerMarker);
    pickerMarker = L.marker([lat, lng], {
        icon: L.divIcon({
            className: '',
            html: `<div class="picker-pin"><div class="picker-pin-inner"></div></div>`,
            iconSize: [30, 40], iconAnchor: [15, 40]
        })
    }).addTo(pickerMap);

    document.getElementById('mapPickerCoords').textContent =
        `📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    document.getElementById('mapPickerConfirm').disabled = false;

    // Reverse geocode for display name
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
        .then(r => r.json())
        .then(d => {
            const name = d.display_name ? d.display_name.split(',').slice(0,3).join(',') : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            document.getElementById('mapPickerCoords').textContent = `📍 ${name}`;
            pickerMap._pickedName = name;
        })
        .catch(() => {});
}

function confirmMapLocation() {
    if (pickedLat === null) return;
    const name = pickerMap._pickedName || `${pickedLat.toFixed(5)}, ${pickedLng.toFixed(5)}`;
    document.getElementById('location').value = name;
    setCoords(pickedLat.toFixed(6), pickedLng.toFixed(6));
    setMethodBadge('map');
    setStatus(`✅ Location picked: ${name}`, 'success');
    closeMapPickerBtn();
}

function closeMapPickerBtn() {
    const overlay = document.getElementById('mapPickerOverlay');
    overlay.classList.remove('active');
    document.body.style.overflow = '';
}

function closeMapPicker(e) {
    if (e.target === document.getElementById('mapPickerOverlay')) closeMapPickerBtn();
}

/* ══════════════════════════════════════════════════════════
   FORM VALIDATION
════════════════════════════════════════════════════════════ */
function validateLocation() {
    const lat = document.getElementById('lat').value;
    const lng = document.getElementById('lng').value;
    if (!lat || !lng) {
        // Try geocoding synchronously isn't possible, so warn and
        // ask user to use one of the three methods.
        const locText = document.getElementById('location').value.trim();
        if (!locText) {
            alert('Please enter a location before submitting.');
            return false;
        }
        // Attempt geocoding and resubmit if successful
        const btn = document.getElementById('submitBtn');
        btn.disabled    = true;
        btn.textContent = 'Locating…';
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(locText)}&format=json&limit=1`;
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data && data.length > 0) {
                    setCoords(parseFloat(data[0].lat).toFixed(6), parseFloat(data[0].lon).toFixed(6));
                    setMethodBadge('manual');
                    document.getElementById('reportForm').submit();
                } else {
                    alert('Location not found. Please pick on map or use auto-detect.');
                    btn.disabled    = false;
                    btn.textContent = 'Report Found Item';
                }
            })
            .catch(() => {
                alert('Location not found. Please pick on map or use auto-detect.');
                btn.disabled    = false;
                btn.textContent = 'Report Found Item';
            });
        return false;  // Prevent default; we'll submit manually above
    }
    return true;
}

/* ══════════════════════════════════════════════════════════
   AUTO-DETECT ON PAGE LOAD (silent – no alert on denial)
════════════════════════════════════════════════════════════ */
window.addEventListener('load', () => {
    if (!navigator.geolocation) return;
    // Silently try; if denied just show nothing
    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude.toFixed(6);
            const lng = pos.coords.longitude.toFixed(6);
            setCoords(lat, lng);
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
                .then(r => r.json())
                .then(d => {
                    const addr  = d.address || {};
                    const label = addr.suburb || addr.city_district ||
                                  addr.city   || addr.town || addr.village || 'Your Location';
                    if (!document.getElementById('location').value) {
                        document.getElementById('location').value = label;
                    }
                    setStatus(`📍 Location detected automatically`, 'success');
                    setMethodBadge('auto');
                })
                .catch(() => {
                    setStatus(`📍 Location detected automatically`, 'success');
                    setMethodBadge('auto');
                });
        },
        () => { /* silently ignored */ },
        { timeout: 8000, maximumAge: 60000 }
    );
});
</script>
{% endblock %}
