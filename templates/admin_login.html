{% extends "base.html" %}
{% block content %}
<div class="container form-page">
    <div class="compact-form" style="border-top: 4px solid #8b5cf6;">
        <h2 class="page-title" style="color: #4c1d95;">Admin Authentication</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}" style="color: {{ '#ef4444' if category == 'danger' or category == 'warning' else '#10b981' }}; margin-bottom: 15px; font-size: 14px; text-align: center;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);">Authenticate</button>
        </form>
    </div>
</div>
{% endblock %}
